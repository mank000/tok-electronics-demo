name: PostgreSQL checks

on:
  pull_request:
  push:
    branches: [main, dev, feat/shop-order-lifecycle]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: electroshop
          POSTGRES_USER: electroshop
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electroshop -d electroshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_HOST: 127.0.0.1
      POSTGRES_DB: electroshop
      POSTGRES_USER: electroshop
      POSTGRES_PASSWORD: ci-postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test the PostgreSQL checkout and application
        run: |
          python manage.py shell -c 'from django.db import connection; assert connection.vendor == "postgresql" and connection.features.has_select_for_update'
          python manage.py test --verbosity 2
