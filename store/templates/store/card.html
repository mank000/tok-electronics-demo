<article class="product-card"><a href="{% url 'product' item.slug %}" class="card-image">{% with photo=item.first_image %}{% if photo %}<img src="{{ photo.thumb.url }}" alt="{{ photo.alt }}" loading="lazy">{% endif %}{% endwith %}<span class="card-arrow">↗</span></a><div class="card-info"><span class="card-category">{{ item.category.name }}</span><a href="{% url 'product' item.slug %}" class="card-title">{{ item.name }}</a><div class="card-bottom"><strong>{{ item.price|floatformat:0 }} ₽</strong><span class="availability availability-{{ item.availability }}">{{ item.get_availability_display }}</span></div></div></article>
