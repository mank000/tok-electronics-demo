name: tgapp-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroshop}
      POSTGRES_USER: ${POSTGRES_USER:-electroshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL_HOST: db
      DJANGO_PRODUCTION: "1"
      DJANGO_DEBUG: "0"
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod}
    command: >-
      sh -c "python manage.py check --deploy --fail-level ERROR
      && python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --config gunicorn.conf.py"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz/',headers={'Host':os.environ['SITE_DOMAIN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  notifications:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL_HOST: db
      DJANGO_PRODUCTION: "1"
      DJANGO_DEBUG: "0"
    command: python manage.py runnotifications
    depends_on:
      web:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL_HOST: db
      DJANGO_PRODUCTION: "1"
      DJANGO_DEBUG: "0"
    command: python manage.py runbot
    depends_on:
      web:
        condition: service_healthy
    profiles: ["bot"]

volumes:
  pgdata:
  media:
  staticfiles:
  caddy_data:
  caddy_config:
